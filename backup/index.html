<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>秋招备考打卡</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --line:#e6e9ef;
  --primary:#2f6fed; --primary-weak:#e8f0fe;
  --green:#2e9e5b; --green-weak:#e7f6ec;
  --red:#e4572e; --red-weak:#fdeee8;
  --text:#1f2430; --text-2:#5c6470; --text-3:#9aa1ad;
  --shadow:0 1px 3px rgba(31,36,48,.06),0 4px 14px rgba(31,36,48,.05);
  --radius:14px;
  --tabbar-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.hidden{display:none!important}

/* ===== Header ===== */
.app-header{
  position:sticky;top:0;z-index:20;background:rgba(245,247,250,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.app-header-inner{max-width:760px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
.app-header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.app-header .badge{font-size:11px;color:var(--red);background:var(--red-weak);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.app-header-sub{font-size:12px;color:var(--text-3)}
.backup-tip{
  max-width:760px;margin:0 auto;padding:8px 16px;font-size:13px;color:#8a5a00;
  background:#fff7e0;border-top:1px solid #f5e6b8;display:flex;align-items:center;justify-content:space-between;
}
.backup-tip button{background:none;border:none;color:#8a5a00;font-size:13px;padding:6px 8px}

/* ===== 布局 ===== */
main{max-width:760px;margin:0 auto}
.page{display:none;padding:14px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px)}
.page.active{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-title .sub{font-weight:400;font-size:12px;color:var(--text-3)}
details.card summary{list-style:none;cursor:pointer;user-select:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:'▸';display:inline-block;transition:transform .2s;color:var(--text-3);margin-right:2px}
details.card[open] summary::before{transform:rotate(90deg)}
.hint{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.6}
.empty{text-align:center;color:var(--text-3);padding:42px 16px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--text-2);margin-bottom:6px}

/* ===== 今日摘要条 ===== */
.summary-strip{display:flex;justify-content:space-around;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 8px;margin-bottom:12px}
.ss-item{font-size:12px;color:var(--text-2)}
.ss-item b{font-size:17px;color:var(--primary);margin-right:3px}

/* ===== 日期切换 ===== */
.date-switch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 8px;margin-bottom:12px}
.icon-btn{width:44px;height:44px;flex:none;border:none;background:var(--primary-weak);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.35}
.date-mid{flex:1;text-align:center}
.date-main{font-size:16px;font-weight:700}
.date-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.goto-today{display:inline-block;margin:0 auto;background:none;border:1px solid var(--line);color:var(--text-2);font-size:12px;border-radius:999px;padding:2px 10px;margin-top:4px}

/* ===== 进度条 ===== */
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px}
.progress-head b{color:var(--primary);font-size:15px}
.progress-track{height:10px;background:#eef1f6;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#6f9bef);border-radius:999px;transition:width .25s ease}

/* ===== 打卡组 ===== */
.group-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.group-dot{width:9px;height:9px;border-radius:3px;flex:none}
.group-name{font-size:14px;font-weight:700}
.group-meta{font-size:11px;color:var(--text-3);background:#f1f3f7;padding:2px 8px;border-radius:999px}
.group-count{margin-left:auto;font-size:12px;color:var(--text-2);font-weight:600}
.group-count b{color:var(--green);font-size:13px}
.check-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #f1f3f7;cursor:pointer;min-height:48px;user-select:none}
.check-item:last-child{border-bottom:none}
.check-item input{display:none}
.check-item .box{width:22px;height:22px;border-radius:7px;border:2px solid #c3c9d4;flex:none;position:relative;transition:all .15s;background:#fff}
.check-item input:checked + .box{background:var(--green);border-color:var(--green)}
.check-item input:checked + .box::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check-item .title{font-size:15px;transition:color .15s}
.check-item.done .title{color:var(--text-3);text-decoration:line-through}

/* ===== 今日留档 ===== */
.field-label{font-size:13px;font-weight:600;color:var(--text-2);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.field-label .fl-tag{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:400}
.fl-reflect{background:#f3f0ff;color:#7c5cd6}
.fl-insight{background:#e7f6ec;color:var(--green)}
.fl-adjust{background:#fff3e8;color:#d97a00}
textarea{
  width:100%;min-height:66px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:16px;resize:vertical;background:#fbfcfe;color:var(--text);outline:none;transition:border-color .15s;
}
textarea:focus{border-color:var(--primary);background:#fff}
textarea::placeholder{color:#b3bac4}

/* ===== 按钮 ===== */
.btn{border:none;border-radius:10px;padding:11px 14px;font-size:14px;min-height:44px;font-weight:600;background:#f1f3f7;color:var(--text-2);transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--red-weak);color:var(--red)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--text-2)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1;min-width:120px}

/* ===== 计划管理 ===== */
.plan-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #f1f3f7;min-height:48px}
.plan-row:last-child{border-bottom:none}
.plan-row.dragging{opacity:.4;border:1px dashed var(--primary);border-radius:8px}
.drag-handle{color:#c3c9d4;font-size:13px;letter-spacing:-2px;cursor:grab;flex:none;padding:4px}
.plan-title{flex:1;font-size:14px;min-width:0;word-break:break-all}
.plan-ops{display:flex;gap:4px;flex:none}
.plan-ops button{background:#f1f3f7;border:none;border-radius:8px;min-width:40px;min-height:36px;font-size:12px;color:var(--text-2);padding:0 8px}
.plan-ops button.del{color:var(--red);background:var(--red-weak)}
.plan-row.editing .edit-input{flex:1;border:1px solid var(--primary);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0;outline:none}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;background:#fbfcfe}
.add-row input:focus{border-color:var(--primary)}
.archived-box{margin-top:10px;font-size:12px;color:var(--text-3);background:#f8f9fb;border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.archived-box button{background:none;border:none;color:var(--primary);font-size:12px;padding:4px 6px;text-decoration:underline}

/* ===== 计划总览 ===== */
.overview .ov-sec{margin-top:12px}
.overview .ov-sec:first-child{margin-top:2px}
.overview h4{font-size:13px;color:var(--text-2);margin-bottom:6px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--primary-weak);border-radius:2px}
.tl-item{position:relative;margin-bottom:10px}
.tl-item::before{content:'';position:absolute;left:-16px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tl-phase{font-size:14px;font-weight:700}
.tl-item p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.bar-503020{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-bottom:8px}
.bar-503020 i{display:block;height:100%}
.b1{background:#2f6fed}.b2{background:#7c5cd6}.b3{background:#f59e0b}
.legend-line{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px}
.d1{background:#2f6fed}.d2{background:#7c5cd6}.d3{background:#f59e0b}
.overview ul{padding-left:2px;list-style:none}
.overview ul li{font-size:13px;color:var(--text-2);margin-bottom:6px;padding-left:16px;position:relative}
.overview ul li::before{content:'';position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:2px;background:var(--green)}

/* ===== 统计 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 10px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--primary);line-height:1.2}
.stat-num.green{color:var(--green)}
.stat-label{font-size:12px;color:var(--text-3);margin-top:4px}
.hm-wrap{overflow-x:auto}
.hm-months{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-bottom:4px;min-width:340px}
.hm-month{font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;height:14px}
.hm-grid{display:grid;grid-template-columns:repeat(26,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;min-width:340px}
.hm-cell{aspect-ratio:1;border-radius:3px;background:#ebedf0;display:block}
.hm-cell.c1{background:#9be9a8}
.hm-cell.c2{background:#40c463}
.hm-cell.c3{background:#216e39}
.hm-cell.future{background:transparent}
.hm-cell.today{outline:2px solid var(--primary);outline-offset:-1px}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);margin-top:8px}
.hm-legend i{width:12px;height:12px;border-radius:3px}
.hm-legend .note{margin-left:auto;font-size:11px}

/* ===== 日志 ===== */
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--text-2);min-height:40px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.log-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.log-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.log-head .date{font-size:14px;font-weight:700}
.log-head .wk{font-size:11px;color:var(--text-3)}
.log-head .cnt{font-size:11px;color:var(--green);background:var(--green-weak);padding:2px 8px;border-radius:999px}
.log-head .edit{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--text-2);padding:5px 10px;min-height:34px}
.log-field{font-size:13.5px;color:var(--text);margin-top:8px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.log-field .tag{font-size:10px;padding:1px 7px;border-radius:999px;margin-right:6px;font-weight:600}
.tag-reflect{background:#f3f0ff;color:#7c5cd6}
.tag-insight{background:#e7f6ec;color:var(--green)}
.tag-adjust{background:#fff3e8;color:#d97a00}
.log-empty{font-size:12.5px;color:var(--text-3);margin-top:6px}

/* ===== Tabbar ===== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;font-size:11px;color:var(--text-3);min-height:44px;transition:color .15s;
}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{color:var(--primary);font-weight:600}
.tabbar button:active{opacity:.7}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(10px);
  background:rgba(31,36,48,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:99;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:768px){
  .page{padding-top:20px}
  textarea{font-size:15px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <h1>秋招备考打卡<span id="degradeBadge" class="badge hidden">降级模式</span></h1>
    <div class="app-header-sub">持续积累 · 稳定输出</div>
  </div>
  <div id="backupTip" class="backup-tip hidden">
    <span id="backupTipText">数据已积累，建议导出备份</span>
    <button data-act="dismissTip">知道了</button>
  </div>
</header>

<main>
  <section id="page-today" class="page active"></section>
  <section id="page-plan" class="page"></section>
  <section id="page-stats" class="page"></section>
  <section id="page-log" class="page"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="active" aria-label="今日">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
    今日
  </button>
  <button data-tab="plan" aria-label="计划">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    计划
  </button>
  <button data-tab="stats" aria-label="统计">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
    统计
  </button>
  <button data-tab="log" aria-label="日志">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    日志
  </button>
</nav>

<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================================================================
 * 秋招备考打卡系统 · 单文件应用
 * 存储：IndexedDB（不可用时降级 localStorage）· 零外部依赖 · 离线可用
 * ================================================================ */

/* ---------- 工具 ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
function parseDate(s){ const p=s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function weekdayCN(d){ return ['日','一','二','三','四','五','六'][d.getDay()]; }
function uid(){ return 'it'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function bySort(a,b){ return (a.sort||0)-(b.sort||0); }
function download(text, name, type){
  const blob = new Blob([text], {type: type || 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 120);
}
function csvEsc(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; }
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ================================================================
 * DataLayer：IndexedDB 封装 + localStorage 降级（~150 行）
 * 库 autumn-recruit-checkin v1，三 store：planItems / days / meta
 * ================================================================ */
const DataLayer = (() => {
  const DB_NAME = 'autumn-recruit-checkin', DB_VER = 1, PREFIX = 'wb_arc_';
  let db = null, mode = 'idb'; // 'idb' | 'ls'

  function lsGet(store){ try{ return JSON.parse(localStorage.getItem(PREFIX+store)||'null') || []; }catch(e){ return []; } }
  function lsSet(store, arr){ try{ localStorage.setItem(PREFIX+store, JSON.stringify(arr)); }catch(e){ console.warn('[DL] localStorage 写入失败', e); } }
  function keyOf(store, obj){ return store === 'days' ? obj.date : (store === 'meta' ? obj.key : obj.id); }

  function init(){
    return new Promise(resolve => {
      try{
        if(!window.indexedDB){ mode='ls'; console.warn('[DL] IndexedDB 不可用，降级 localStorage'); return resolve(); }
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if(!d.objectStoreNames.contains('planItems')){
            const s = d.createObjectStore('planItems', {keyPath:'id'});
            s.createIndex('groupId','groupId');
          }
          if(!d.objectStoreNames.contains('days')) d.createObjectStore('days', {keyPath:'date'});
          if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
        };
        req.onsuccess  = e => { db = e.target.result; resolve(); };
        req.onerror    = () => { mode='ls'; console.warn('[DL] IndexedDB 打开失败，降级 localStorage'); resolve(); };
        req.onblocked  = () => { mode='ls'; resolve(); };
      }catch(err){ mode='ls'; resolve(); }
    });
  }

  function tx(store, fn, rw){
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, rw || 'readonly');
      const s = t.objectStore(store);
      let out;
      try{ out = fn(s); }catch(e){ return reject(e); }
      t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => reject(t.error); t.onabort = () => reject(t.error);
    });
  }

  async function getAll(store){
    if(mode === 'ls') return lsGet(store);
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readonly');
      const r = t.objectStore(store).getAll();
      t.oncomplete = () => resolve(r.result || []);
      t.onerror = () => reject(t.error);
    });
  }

  async function put(store, obj){
    if(mode === 'ls'){
      const arr = lsGet(store), k = keyOf(store, obj), i = arr.findIndex(x => keyOf(store, x) === k);
      if(i >= 0) arr[i] = obj; else arr.push(obj);
      lsSet(store, arr); return;
    }
    await tx(store, s => s.put(obj), 'readwrite');
  }

  async function remove(store, key){
    if(mode === 'ls'){
      const arr = lsGet(store), i = arr.findIndex(x => keyOf(store, x) === key);
      if(i >= 0){ arr.splice(i,1); lsSet(store, arr); }
      return;
    }
    await tx(store, s => s.delete(key), 'readwrite');
  }

  async function clear(store){
    if(mode === 'ls'){ lsSet(store, []); return; }
    await new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).clear();
      t.oncomplete = resolve; t.onerror = () => reject(t.error); t.onabort = () => reject(t.error);
    });
  }

  async function putAll(store, arr){
    if(mode === 'ls'){ lsSet(store, arr); return; }
    await new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readwrite');
      const s = t.objectStore(store);
      arr.forEach(o => s.put(o));
      t.oncomplete = resolve; t.onerror = () => reject(t.error); t.onabort = () => reject(t.error);
    });
  }

  function isDegraded(){ return mode === 'ls'; }
  return { init, getAll, put, remove, clear, putAll, isDegraded };
})();

/* ================================================================
 * Store：内存状态 + 串行写队列（消除 IndexedDB 异步竞态）
 * ================================================================ */
const Store = (() => {
  const state = {
    currentDate: todayStr(),
    planItems: [],   // 全部计划项（含 archived）
    days: {},        // date -> {date, doneIds, reflect, insight, adjust, updatedAt}
    meta: {},        // key -> value
  };
  let chain = Promise.resolve();

  function enqueue(fn){
    chain = chain.then(fn).catch(e => console.error('[Store] 写队列错误', e));
    return chain;
  }

  function setPlanItems(items){ state.planItems = items || []; }
  function setDays(arr){ state.days = {}; (arr||[]).forEach(d => state.days[d.date] = d); }
  function setMeta(arr){ state.meta = {}; (arr||[]).forEach(m => state.meta[m.key] = m.value); }

  function activeItems(){ return state.planItems.filter(p => !p.archived).sort(bySort); }
  function itemsByGroup(gid){ return activeItems().filter(p => p.groupId === gid); }
  function dayOf(ds){ return state.days[ds] || { date: ds, doneIds: [], reflect:'', insight:'', adjust:'', updatedAt: 0 }; }
  function getMeta(key){ return state.meta[key]; }
  function setMetaKV(key, value){
    state.meta[key] = value;
    return enqueue(() => DataLayer.put('meta', { key, value }));
  }

  /* 写入某天记录（upsert；doneIds 去重；空且原本不存在则不建空记录） */
  function saveDay(ds, patch){
    return enqueue(async () => {
      const exists = !!state.days[ds];
      const cur = state.days[ds] || { date: ds, doneIds: [], reflect:'', insight:'', adjust:'', updatedAt: 0 };
      const next = Object.assign({}, cur, patch, { updatedAt: Date.now() });
      next.doneIds = Array.from(new Set(next.doneIds || []));
      const isEmpty = next.doneIds.length === 0 && !String(next.reflect).trim() && !String(next.insight).trim() && !String(next.adjust).trim();
      if(isEmpty && !exists){ delete state.days[ds]; return; }
      state.days[ds] = next;
      await DataLayer.put('days', next);
    });
  }

  return { state, enqueue, setPlanItems, setDays, setMeta, activeItems, itemsByGroup, dayOf, getMeta, setMetaKV, saveDay };
})();

/* 重置种子：按「组+标题」匹配已有项（含已归档）→ 恢复并归位，历史 doneIds 不断链 */
async function resetSeed(){
  const items = Store.state.planItems.slice();
  let changed = false;
  SEED_ITEMS.forEach(seed => {
    const found = items.find(p => p.groupId === seed.groupId && p.title === seed.title);
    if(found){
      if(found.archived || (found.sort||0) !== seed.sort){ found.archived = false; found.sort = seed.sort; changed = true; }
    }else{
      items.push({ id: uid(), groupId: seed.groupId, title: seed.title, sort: seed.sort, archived: false });
      changed = true;
    }
  });
  if(changed){ await DataLayer.putAll('planItems', items); Store.setPlanItems(items); }
  await Store.setMetaKV('seedVersion', SEED_VERSION);
}

/* 勾选 → 防抖合并写库 + 即时更新进度/计数（不重渲染，保住文本光标） */
function toggleDone(id, checked){
  const ds = Store.state.currentDate;
  const set = new Set(Store.dayOf(ds).doneIds);
  if(checked) set.add(id); else set.delete(id);
  pendingDone = { ds, doneIds: Array.from(set) };
  clearTimeout(doneTimer);
  doneTimer = setTimeout(flushDone, 400);
  updateTodayUI();
}
function flushDone(){
  if(!pendingDone) return;
  const { ds, doneIds } = pendingDone; pendingDone = null;
  Store.saveDay(ds, { doneIds });
}
function updateTodayUI(){
  const ds = Store.state.currentDate;
  const set = new Set((pendingDone && pendingDone.ds === ds) ? pendingDone.doneIds : Store.dayOf(ds).doneIds);
  const items = Store.activeItems();
  GROUPS.forEach(g => {
    const list = items.filter(p => p.groupId === g.id);
    const cnt = list.filter(p => set.has(p.id)).length;
    const node = $('.group-count[data-gid="'+g.id+'"]');
    if(node) node.innerHTML = '<b>'+cnt+'</b> / '+list.length;
  });

  const fill = $('#todayProgressFill'); if(fill) fill.style.width = rate + '%';
  const num  = $('#todayProgressNum');  if(num)  num.textContent = rate + '%';
}

function addPlanItem(gid){
  const input = $('input[data-add="'+gid+'"]');
  const title = input ? input.value.trim() : '';
  if(!title){ toast('请输入打卡项内容'); return; }
  const groupItems = Store.state.planItems.filter(p => p.groupId === gid && !p.archived).sort(bySort);
  const sort = groupItems.length ? (groupItems[groupItems.length-1].sort||0) + 1 : 0;
  const item = { id: uid(), groupId: gid, title, sort, archived: false };
  Store.state.planItems.push(item);
  DataLayer.put('planItems', item).then(() => { renderPlan(); toast('已添加'); });

}
function saveEditItem(id){
  const input = $('input[data-edit-input="'+id+'"]');
  const title = input ? input.value.trim() : '';
  if(!title){ toast('标题不能为空'); return; }

  if(item){ item.title = title; DataLayer.put('planItems', item).then(() => { editingId = null; renderPlan(); toast('已保存'); }); }

function archiveItem(id){
  const item = Store.state.planItems.find(p => p.id === id);
  if(item){ item.archived = true; DataLayer.put('planItems', item).then(() => renderPlan()); }
}
function restoreItem(id){
  const item = Store.state.planItems.find(p => p.id === id);
  if(item){ item.archived = false; DataLayer.put('planItems', item).then(() => renderPlan()); }
}
function normalizeSorts(){
  GROUPS.forEach(g => {
    const list = Store.state.planItems.filter(p => p.groupId === g.id && !p.archived).sort(bySort);
    list.forEach((p, i) => p.sort = i);
  });
}
function moveItem(id, dir){
  const all = Store.state.planItems;
  const item = all.find(p => p.id === id);
  if(!item) return;
  const group = all.filter(p => p.groupId === item.groupId && !p.archived).sort(bySort);
  const i = group.indexOf(item), j = i + dir;
  if(i < 0 || j < 0 || j >= group.length) return;
  [group[i].sort, group[j].sort] = [group[j].sort, group[i].sort];
  normalizeSorts();
  DataLayer.putAll('planItems', all).then(() => renderPlan());
}
function reorderItems(fromId, toId){
  const all = Store.state.planItems;
  const from = all.find(p => p.id === fromId), to = all.find(p => p.id === toId);
  if(!from || !to || from.groupId !== to.groupId) return;
  const group = all.filter(p => p.groupId === from.groupId && !p.archived).sort(bySort);
  const fi = group.indexOf(from), ti = group.indexOf(to);
  group.splice(ti, 0, group.splice(fi, 1)[0]);
  normalizeSorts();
  DataLayer.putAll('planItems', all).then(() => renderPlan());
}

function weekStart(){
  const d = new Date();
  const dow = (d.getDay() + 6) % 7; // 周一=0
  d.setDate(d.getDate() - dow);
  d.setHours(0,0,0,0);
  return d;
}
function monthStart(){
  const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
  return d;
}
function calcStreak(){
  let s = 0;
  const d = new Date();
  while(true){
    const rec = Store.state.days[fmtDate(d)];
    if(rec && rec.doneIds.length > 0){ s++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return s;
}
/* 区间完成率：累计完成数 ÷ (活跃计划项数 × 区间天数)，结束日含当天 */
function rangeRate(startDate, endDate){
  const active = Store.activeItems().length;
  if(!active) return 0;
  let done = 0;
  for(let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)){
    const rec = Store.state.days[fmtDate(d)];
    if(rec) done += Math.min(rec.doneIds.length, active);
  }
  const days = Math.round((endDate - startDate) / 86400000) + 1;
  return Math.round(done / (active * days) * 100);
}
function buildHeatmap(){
  const WEEKS = 26;
  const today = new Date();
  const thisMon = weekStart();
  const start = new Date(thisMon); start.setDate(start.getDate() - (WEEKS - 1) * 7);
  const active = Store.activeItems().length;
  const ts = todayStr();
  const weeks = [];
  for(let w = 0; w < WEEKS; w++){
    const col = [];
    for(let d = 0; d < 7; d++){
      const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d);
      const ds = fmtDate(dt);
      const rec = Store.state.days[ds];
      const done = rec ? rec.doneIds.length : 0;
      const rate = active ? Math.min(done / active, 1) : 0;
      col.push({ ds, done, rate, future: ds > ts });
    }
    weeks.push(col);
  }
  return weeks;
}
function renderStats(){
  const active = Store.activeItems().length;
  const streak = calcStreak();
  const todayDone = Store.dayOf(todayStr()).doneIds.filter(id => Store.state.planItems.some(p => p.id === id && !p.archived)).length;
  const todayRate = active ? Math.round(todayDone / active * 100) : 0;
  const weekRate = rangeRate(weekStart(), new Date());
  const monthRate = rangeRate(monthStart(), new Date());
  const ts = todayStr();
  const weeks = buildHeatmap();

  let html = '<div class="stats-grid">'
    + '<div class="stat-card"><div class="stat-num">'+streak+'</div><div class="stat-label">连续打卡(天)</div></div>'
    + '<div class="stat-card"><div class="stat-num green">'+weekRate+'%</div><div class="stat-label">本周完成率</div></div>'
    + '<div class="stat-card"><div class="stat-num green">'+monthRate+'%</div><div class="stat-label">本月完成率</div></div>'
    + '</div>';

  html += '<div class="card"><div class="card-title">打卡热力图<span class="sub">近 26 周 · 含今日 '+todayDone+'/'+active+'</span></div>'
    + '<div class="hm-wrap"><div class="hm-months">';
  weeks.forEach((col, w) => {
    const m1 = col[0].ds.slice(5,7);
    const m2 = w > 0 ? weeks[w-1][0].ds.slice(5,7) : null;
    const label = (w === 0 || m1 !== m2) ? parseInt(m1, 10) + '月' : '';
    html += '<span class="hm-month">'+label+'</span>';
  });
  html += '</div><div class="hm-grid">';
  weeks.forEach(col => {
    col.forEach(cell => {
      let cls = 'hm-cell';
      if(cell.future) cls += ' future';
      else if(cell.rate >= 1) cls += ' c3';
      else if(cell.rate >= 0.5) cls += ' c2';
      else if(cell.rate > 0) cls += ' c1';
      if(cell.ds === ts) cls += ' today';
      html += '<span class="'+cls+'" title="'+cell.ds+'：完成 '+cell.done+' 项 ('+Math.round(cell.rate*100)+'%)"></span>';
    });
  });
  html += '</div></div><div class="hm-legend"><span>少</span>'
    + '<i class="hm-cell"></i><i class="hm-cell c1"></i><i class="hm-cell c2"></i><i class="hm-cell c3"></i><span>多</span>'
    + '<span class="note">完成率 = 当日勾选数 ÷ 有效计划项数</span></div></div>';

  html += '<div class="card"><div class="card-title">统计口径说明</div>'
    + '<div class="hint">· 连续天数：当天至少完成 1 项即算打卡，从今天反向遍历，遇空当天即止。<br>'
    + '· 完成率：完成项数 ÷ 有效计划项数（已归档项不计入分母，历史勾选仍保留）。<br>'
    + '· 日历热力图：颜色越深完成率越高，未来日期为空白。</div></div>';

  $('#page-stats').innerHTML = html;
}

/* ================================================================
 * 日志页：时间线 + 筛选 + 回看编辑
 * ================================================================ */
let logFilter = 'all';
function renderLog(){
  const dates = Object.keys(Store.state.days).sort().reverse();
  let html = '<div class="chips">'
    + '<button class="chip'+(logFilter==='all'?' active':'')+'" data-act="logFilter" data-f="all">全部</button>'
    + '<button class="chip'+(logFilter==='reflect'?' active':'')+'" data-act="logFilter" data-f="reflect">反思</button>'
    + '<button class="chip'+(logFilter==='insight'?' active':'')+'" data-act="logFilter" data-f="insight">心得</button>'
    + '<button class="chip'+(logFilter==='adjust'?' active':'')+'" data-act="logFilter" data-f="adjust">调整建议</button>'
    + '</div>';

  if(!dates.length){
    html += '<div class="empty"><b>还没有打卡记录</b>去「今日」开始你的第一天吧</div>';
    $('#page-log').innerHTML = html;
    return;
  }

  const filtered = dates.filter(ds => {
    if(logFilter === 'all') return true;
    const r = Store.state.days[ds];
    return !!String(r[logFilter] || '').trim();
  });
  if(!filtered.length){
    html += '<div class="empty"><b>没有匹配的留档</b>换一个筛选条件试试</div>';
    $('#page-log').innerHTML = html;
    return;
  }

  filtered.forEach(ds => {
    const r = Store.state.days[ds];
    const total = r.doneIds.length;
    html += '<div class="log-item">'
      + '<div class="log-head"><span class="date">'+ds+'</span><span class="wk">周'+weekdayCN(parseDate(ds))+'</span>'
      + '<span class="cnt">打卡 '+total+' 项</span>'
      + '<button class="edit" data-act="editLog" data-ds="'+ds+'">回看 / 编辑</button></div>';
    if(r.reflect)  html += '<div class="log-field"><span class="tag tag-reflect">反思</span>'+esc(r.reflect)+'</div>';
    if(r.insight)  html += '<div class="log-field"><span class="tag tag-insight">心得</span>'+esc(r.insight)+'</div>';
    if(r.adjust)   html += '<div class="log-field"><span class="tag tag-adjust">调整建议</span>'+esc(r.adjust)+'</div>';
    if(!r.reflect && !r.insight && !r.adjust) html += '<div class="log-empty">这一天只有打卡，没有文字留档。</div>';
    html += '</div>';
  });

  $('#page-log').innerHTML = html;
}

/* ================================================================
 * 导出 / 导入
 * ================================================================ */
function exportJson(){
  const payload = {
    app: 'autumn-recruit-checkin',
    version: 1,
    exportedAt: new Date().toISOString(),
    planItems: Store.state.planItems,
    days: Object.values(Store.state.days),
    meta: Object.keys(Store.state.meta).map(k => ({ key: k, value: Store.state.meta[k] })),
  };
  download(JSON.stringify(payload, null, 2), '秋招打卡备份-' + todayStr() + '.json', 'application/json');
  toast('已导出 JSON 备份');
}
function exportCsv(){
  const rows = [['日期','完成数','反思','心得','调整建议']];
  Object.keys(Store.state.days).sort().forEach(ds => {
    const r = Store.state.days[ds];
    rows.push([ds, r.doneIds.length, csvEsc(r.reflect), csvEsc(r.insight), csvEsc(r.adjust)]);
  });
  const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\r\n');
  download(csv, '秋招打卡记录-' + todayStr() + '.csv', 'text/csv;charset=utf-8');
  toast('已导出 CSV');
}
async function importJson(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data || !Array.isArray(data.planItems) || !Array.isArray(data.days)) throw new Error('文件格式不正确（非本应用备份）');
    if(!confirm('导入将覆盖当前全部数据（含计划、打卡、日志），确定继续？建议先导出当前备份。')) return;
    await DataLayer.clear('planItems');
    await DataLayer.clear('days');
    await DataLayer.clear('meta');
    await DataLayer.putAll('planItems', data.planItems);
    await DataLayer.putAll('days', data.days);
    await DataLayer.putAll('meta', data.meta || []);
    await reloadAll();
    Store.state.currentDate = todayStr();
    editingId = null;
    renderAll();
    toast('导入成功');
  }catch(e){
    toast('导入失败：' + e.message);
  }
}

/* ================================================================
 * Tab 路由 / 初始化
 * ================================================================ */
function switchTab(tab){
  flushText(); flushDone();
  $$('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + tab));
  if(tab === 'today') renderToday();
  if(tab === 'plan') renderPlan();
  if(tab === 'stats') renderStats();
  if(tab === 'log') renderLog();
  window.scrollTo(0, 0);
}
function renderAll(){
  renderToday(); renderPlan(); renderStats(); renderLog(); updateHeader();
}
function updateHeader(){
  const days = Object.keys(Store.state.days).length;
  const tip = $('#backupTip');
  tip.classList.toggle('hidden', days < 30);
  $('#backupTipText').textContent = '数据已积累 ' + days + ' 天记录，建议导出备份';
  $('#degradeBadge').classList.toggle('hidden', !DataLayer.isDegraded());
}

function bindEvents(){
  $('#tabbar').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if(b) switchTab(b.dataset.tab);
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act;
    switch(act){
      case 'prevDay': setCurrentDate(fmtDate(addDays(parseDate(Store.state.currentDate), -1))); break;
      case 'nextDay': setCurrentDate(fmtDate(addDays(parseDate(Store.state.currentDate), 1))); break;
      case 'gotoToday': setCurrentDate(todayStr()); break;
      case 'exportJson': exportJson(); break;
      case 'exportCsv': exportCsv(); break;
      case 'importJson': $('#importFile').click(); break;
      case 'clearAll': clearAll(); break;
      case 'resetSeed': resetSeedFlow(); break;
      case 'addItem': addPlanItem(el.dataset.gid); break;
      case 'editItem': editingId = el.dataset.id; renderPlan(); { const inp = $('input[data-edit-input="'+el.dataset.id+'"]'); if(inp) inp.focus(); } break;
      case 'saveEdit': saveEditItem(el.dataset.id); break;
      case 'cancelEdit': editingId = null; renderPlan(); break;
      case 'archiveItem': archiveItem(el.dataset.id); break;
      case 'restoreItem': restoreItem(el.dataset.id); break;
      case 'moveUp': moveItem(el.dataset.id, -1); break;
      case 'moveDown': moveItem(el.dataset.id, 1); break;
      case 'editLog': { const ds = el.dataset.ds; switchTab('today'); setCurrentDate(ds); toast('正在回看 ' + ds); break; }
      case 'logFilter': logFilter = el.dataset.f; renderLog(); break;
      case 'dismissTip': $('#backupTip').classList.add('hidden'); break;
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if(t.type === 'checkbox' && t.dataset.id){
      const item = t.closest('.check-item');
      if(item) item.classList.toggle('done', t.checked);
      toggleDone(t.dataset.id, t.checked);
    }
  });

  document.addEventListener('input', e => {
    if(e.target.matches('textarea[data-field]')){
      scheduleTextSave(e.target.dataset.field, e.target.value);
    }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.matches('input[data-add]')){
      e.preventDefault();
      addPlanItem(e.target.dataset.add);
    }
  });

  /* 拖拽排序（PC 端） */
  let dragId = null;
  document.addEventListener('dragstart', e => {
    const row = e.target.closest('.plan-row');
    if(!row || !row.dataset.id) return;
    dragId = row.dataset.id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', row.dataset.id); }catch(err){}
  });
  document.addEventListener('dragover', e => {
    const row = e.target.closest('.plan-row');
    if(!row || !dragId || row.dataset.id === dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  document.addEventListener('drop', e => {
    const row = e.target.closest('.plan-row');
    if(!row || !dragId) return;
    e.preventDefault();
    if(row.dataset.id !== dragId) reorderItems(dragId, row.dataset.id);
  });
  document.addEventListener('dragend', () => {
    $$('.plan-row.dragging').forEach(r => r.classList.remove('dragging'));
    dragId = null;
  });

  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) importJson(f);
    e.target.value = '';
  });
}

async function reloadAll(){
  const [items, days, metas] = await Promise.all([
    DataLayer.getAll('planItems'),
    DataLayer.getAll('days'),
    DataLayer.getAll('meta'),
  ]);
  Store.setPlanItems(items);
  Store.setDays(days);
  Store.setMeta(metas);
}

(async function init(){
  await DataLayer.init();
  await reloadAll();
  await seedIfNeeded();
  await reloadAll(); // 播种后重读一次，保证内存与库一致
  bindEvents();
  renderAll();
  updateHeader();
})();
</script>
